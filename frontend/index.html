<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="api-base-url" content="">
<title>Ember — Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   CSS VARIABLES — DARK THEME (default)
   ═══════════════════════════════════════════ */
:root {
  --bg-primary: #0f0e0c;
  --bg-secondary: #1a1814;
  --bg-tertiary: #252220;
  --bg-elevated: #2e2a26;
  --bg-hover: #383430;
  --text-primary: #f0ebe3;
  --text-secondary: #a89e92;
  --text-muted: #6b6158;
  --border-subtle: rgba(255,255,255,0.06);
  --border-medium: rgba(255,255,255,0.1);
  --modal-backdrop: rgba(0,0,0,0.6);
  --sidebar-backdrop: rgba(0,0,0,0.5);
  --input-bg: var(--bg-tertiary);
  --toggle-bg: var(--bg-tertiary);
  --toggle-knob: var(--accent-amber);

  --accent-amber: #e8a849;
  --accent-amber-dim: #c4872e;
  --accent-coral: #e07a5f;
  --accent-coral-dim: #b85a42;
  --accent-teal: #5bb5a2;
  --accent-teal-dim: #3d8a7a;
  --accent-rose: #d4687a;
  --accent-rose-dim: #a84d5e;
  --accent-lavender: #9b8ec4;
  --accent-lavender-dim: #7568a0;
  --accent-sage: #8aab6e;
  --accent-sage-dim: #6a8a50;

  --cat-health: var(--accent-coral);
  --cat-work: var(--accent-amber);
  --cat-mind: var(--accent-lavender);
  --cat-creative: var(--accent-rose);
  --cat-social: var(--accent-teal);
  --cat-other: var(--accent-sage);

  --heat-0: var(--bg-tertiary);
  --heat-1: #2a4a3a;
  --heat-2: #3a6a50;
  --heat-3: #4a8a68;
  --heat-4: #5aaa80;
  --heat-5: #7acaa0;

  --font-display: 'DM Serif Display', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 24px;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.5);

  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 400ms cubic-bezier(0.16, 1, 0.3, 1);
}

/* ═══════════════════════════════════════════
   CSS VARIABLES — LIGHT THEME
   ═══════════════════════════════════════════ */
[data-theme="light"] {
  --bg-primary: #faf8f4;
  --bg-secondary: #ffffff;
  --bg-tertiary: #f0ece6;
  --bg-elevated: #e8e3db;
  --bg-hover: #ddd8cf;
  --text-primary: #1a1814;
  --text-secondary: #6b6158;
  --text-muted: #a89e92;
  --border-subtle: rgba(0,0,0,0.06);
  --border-medium: rgba(0,0,0,0.1);
  --modal-backdrop: rgba(0,0,0,0.3);
  --sidebar-backdrop: rgba(0,0,0,0.2);
  --input-bg: var(--bg-tertiary);
  --toggle-bg: var(--bg-elevated);
  --toggle-knob: var(--accent-amber);

  --heat-0: var(--bg-tertiary);
  --heat-1: #c8e6d8;
  --heat-2: #96d0b4;
  --heat-3: #64ba90;
  --heat-4: #3ea472;
  --heat-5: #1a8a54;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.5;
  transition: background var(--transition-normal), color var(--transition-normal);
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

input, textarea, select {
  font-family: inherit;
  border: none;
  background: none;
  color: inherit;
}

/* ═══════════════════════════════════════════
   LAYOUT
   ═══════════════════════════════════════════ */
.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-subtle);
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 12px;
  flex-wrap: nowrap;
  transition: background var(--transition-normal);
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.topbar-brand .logo {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent-amber), var(--accent-coral));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.topbar-brand h1 {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 400;
  letter-spacing: -0.02em;
}

.view-tabs {
  display: flex;
  background: var(--bg-tertiary);
  border-radius: var(--radius-md);
  padding: 3px;
  gap: 2px;
  flex-shrink: 0;
}

.view-tab {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
  white-space: nowrap;
}

.view-tab:hover { color: var(--text-primary); }

.view-tab.active {
  background: var(--bg-elevated);
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
}

.topbar-actions {
  display: flex;
  gap: 4px;
  align-items: center;
  flex-shrink: 0;
}

.btn-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.05rem;
  transition: all var(--transition-fast);
  color: var(--text-secondary);
}

.btn-icon:hover {
  background: var(--bg-tertiary);
  color: var(--text-primary);
}

/* Theme toggle switch */
.theme-toggle {
  position: relative;
  width: 48px;
  height: 26px;
  border-radius: 13px;
  background: var(--toggle-bg);
  border: 1px solid var(--border-medium);
  cursor: pointer;
  transition: all var(--transition-fast);
  flex-shrink: 0;
}

.theme-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--toggle-knob);
  transition: transform var(--transition-fast);
}

[data-theme="light"] .theme-toggle::after {
  transform: translateX(22px);
}

.theme-toggle-icons {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5px;
  font-size: 0.65rem;
  pointer-events: none;
}

/* Main content area */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* Sidebar */
.sidebar {
  width: 260px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
  transition: transform var(--transition-slow), width var(--transition-slow), background var(--transition-normal);
}

.sidebar.collapsed {
  width: 0;
  border-right: none;
  overflow: hidden;
}

.sidebar-header {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.sidebar-header h2 {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 400;
}

.btn-add-habit {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  background: var(--accent-amber);
  color: var(--bg-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  font-weight: 600;
  transition: all var(--transition-fast);
}

.btn-add-habit:hover {
  background: var(--accent-amber-dim);
  transform: scale(1.05);
}

.habit-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.habit-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
  position: relative;
}

.habit-item:hover { background: var(--bg-tertiary); }

.habit-item.selected { background: var(--bg-elevated); }

.habit-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.habit-info {
  flex: 1;
  min-width: 0;
}

.habit-name {
  font-size: 0.82rem;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.habit-category {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.habit-streak-badge {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--accent-amber);
  white-space: nowrap;
}

.habit-item .btn-delete {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0;
  transition: opacity var(--transition-fast);
  color: var(--text-muted);
  font-size: 0.85rem;
  padding: 4px;
}

.habit-item:hover .btn-delete { opacity: 1; }
.habit-item .btn-delete:hover { color: var(--accent-coral); }

/* Content area */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  transition: background var(--transition-normal);
}

/* ═══════════════════════════════════════════
   DAY VIEW
   ═══════════════════════════════════════════ */
.day-header {
  text-align: center;
  margin-bottom: 28px;
}

.day-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 6px;
}

.day-nav-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--bg-tertiary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.95rem;
  transition: all var(--transition-fast);
  color: var(--text-secondary);
}

.day-nav-btn:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
}

.day-nav-btn.today-btn {
  width: auto;
  border-radius: var(--radius-md);
  padding: 0 14px;
  font-size: 0.78rem;
  font-weight: 500;
}

.day-date {
  font-family: var(--font-display);
  font-size: 1.8rem;
  font-weight: 400;
  letter-spacing: -0.02em;
}

.day-progress {
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.progress-bar {
  width: 180px;
  height: 4px;
  background: var(--bg-tertiary);
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-amber), var(--accent-coral));
  border-radius: 2px;
  transition: width var(--transition-slow);
}

.progress-text {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.motivation {
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 0.95rem;
  color: var(--text-secondary);
  margin-bottom: 22px;
  opacity: 0.8;
}

.checkin-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 680px;
  margin: 0 auto;
}

.checkin-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  transition: all var(--transition-normal);
  position: relative;
  overflow: hidden;
}

.checkin-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  border-radius: 0 2px 2px 0;
}

.checkin-card.status-done { border-color: rgba(90,170,128,0.3); }
.checkin-card.status-done::before { background: var(--accent-sage); }
.checkin-card.status-skipped { opacity: 0.6; }
.checkin-card.status-skipped::before { background: var(--text-muted); }

.checkin-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}

.toggle-done {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--border-medium);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
  flex-shrink: 0;
  font-size: 0.75rem;
  color: transparent;
}

.toggle-done:hover { border-color: var(--accent-sage); }

.toggle-done.done {
  background: var(--accent-sage);
  border-color: var(--accent-sage);
  color: var(--bg-primary);
  animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.toggle-done.skipped {
  border-color: var(--text-muted);
  color: var(--text-muted);
}

.checkin-title {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
}

.checkin-title .emoji { font-size: 1.1rem; }
.checkin-title .name { font-weight: 500; font-size: 0.9rem; }

.status-actions { display: flex; gap: 3px; }

.status-btn {
  padding: 3px 8px;
  border-radius: var(--radius-sm);
  font-size: 0.65rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  transition: all var(--transition-fast);
}

.status-btn:hover { color: var(--text-secondary); background: var(--bg-tertiary); }
.status-btn.active-skip { color: var(--text-secondary); background: var(--bg-elevated); }

.checkin-effort {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  padding-left: 38px;
}

.effort-label {
  font-size: 0.7rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.stars { display: flex; gap: 3px; }

.star {
  font-size: 1rem;
  cursor: pointer;
  transition: all var(--transition-fast);
  opacity: 0.3;
  filter: grayscale(1);
}

.star:hover, .star.active {
  opacity: 1;
  filter: grayscale(0);
  transform: scale(1.15);
}

.checkin-note { padding-left: 38px; }

.note-input {
  width: 100%;
  padding: 7px 10px;
  background: var(--input-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  font-size: 0.78rem;
  color: var(--text-secondary);
  resize: none;
  transition: all var(--transition-fast);
  max-height: 56px;
}

.note-input:focus {
  outline: none;
  border-color: var(--border-medium);
  color: var(--text-primary);
}

.note-input::placeholder { color: var(--text-muted); }

/* ═══════════════════════════════════════════
   WEEK VIEW
   ═══════════════════════════════════════════ */
.week-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.week-header h2 {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 400;
}

.week-nav-group {
  display: flex;
  gap: 6px;
}

.week-grid {
  display: grid;
  grid-template-columns: 130px repeat(7, 1fr);
  gap: 1px;
  background: var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.week-grid-header {
  background: var(--bg-secondary);
  padding: 10px 6px;
  text-align: center;
}

.week-grid-header .day-name {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.week-grid-header .day-num {
  font-family: var(--font-display);
  font-size: 1.2rem;
  margin-top: 2px;
}

.week-grid-header.today .day-num { color: var(--accent-amber); }

.week-grid-label {
  background: var(--bg-secondary);
  padding: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  overflow: hidden;
}

.week-grid-label .wl-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 0.78rem;
}

.week-grid-cell {
  background: var(--bg-primary);
  padding: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  cursor: pointer;
  transition: background var(--transition-fast);
}

.week-grid-cell:hover { background: var(--bg-tertiary); }

.habit-dot-week {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  transition: all var(--transition-fast);
}

.habit-dot-week.done {
  background: var(--dot-color, var(--accent-sage));
  animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.habit-dot-week.skipped {
  border: 2px solid var(--text-muted);
  background: transparent;
}

.habit-dot-week.missed {
  border: 2px solid var(--border-subtle);
  background: transparent;
}

/* ═══════════════════════════════════════════
   MONTH VIEW
   ═══════════════════════════════════════════ */
.month-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.month-header h2 {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 400;
}

.month-nav-group { display: flex; gap: 6px; }

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.cal-header {
  background: var(--bg-secondary);
  padding: 8px;
  text-align: center;
  font-size: 0.65rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.cal-day {
  background: var(--bg-primary);
  padding: 6px;
  min-height: 72px;
  cursor: pointer;
  transition: background var(--transition-fast);
}

.cal-day:hover { background: var(--bg-tertiary); }
.cal-day.other-month { opacity: 0.25; }
.cal-day.today { background: var(--bg-secondary); }

.cal-day-num {
  font-size: 0.75rem;
  font-weight: 500;
  margin-bottom: 5px;
}

.cal-day.today .cal-day-num {
  color: var(--accent-amber);
  font-weight: 700;
}

.cal-dots {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
}

.cal-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

/* ═══════════════════════════════════════════
   YEAR VIEW
   ═══════════════════════════════════════════ */
.year-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.year-header h2 {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 400;
}

.year-nav-group { display: flex; gap: 6px; }

.heatmap-container {
  overflow-x: auto;
  padding-bottom: 16px;
}

.heatmap {
  display: inline-grid;
  grid-template-rows: repeat(7, 13px);
  grid-auto-flow: column;
  gap: 3px;
}

.heat-cell {
  width: 13px;
  height: 13px;
  border-radius: 2px;
  background: var(--heat-0);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.heat-cell:hover { transform: scale(1.5); z-index: 10; }

.heat-cell[data-level="1"] { background: var(--heat-1); }
.heat-cell[data-level="2"] { background: var(--heat-2); }
.heat-cell[data-level="3"] { background: var(--heat-3); }
.heat-cell[data-level="4"] { background: var(--heat-4); }
.heat-cell[data-level="5"] { background: var(--heat-5); }

.heatmap-months {
  display: flex;
  margin-bottom: 5px;
}

.heatmap-months span {
  font-size: 0.6rem;
  color: var(--text-muted);
}

.heatmap-legend {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 3px;
  margin-top: 10px;
  font-size: 0.65rem;
  color: var(--text-muted);
}

.heatmap-legend .heat-cell { cursor: default; pointer-events: none; }

.heatmap-tooltip {
  position: fixed;
  background: var(--bg-elevated);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-size: 0.72rem;
  color: var(--text-primary);
  pointer-events: none;
  z-index: 1000;
  box-shadow: var(--shadow-lg);
  max-width: 220px;
  display: none;
  transition: background var(--transition-normal), color var(--transition-normal);
}

.heatmap-tooltip .tt-date { font-weight: 600; margin-bottom: 3px; }
.heatmap-tooltip .tt-count { color: var(--text-secondary); }
.heatmap-tooltip .tt-notes { color: var(--text-muted); margin-top: 3px; font-style: italic; }

/* ═══════════════════════════════════════════
   STATS VIEW
   ═══════════════════════════════════════════ */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
  max-width: 880px;
  margin: 0 auto;
}

.stat-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px;
  transition: background var(--transition-normal);
}

.stat-card h3 {
  font-family: var(--font-display);
  font-size: 1rem;
  font-weight: 400;
  margin-bottom: 14px;
  color: var(--text-secondary);
}

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-subtle);
}

.stat-row:last-child { border-bottom: none; }

.stat-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.82rem;
}

.stat-value {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--accent-amber);
}

.stat-big {
  text-align: center;
  padding: 20px;
}

.stat-big .number {
  font-family: var(--font-display);
  font-size: 2.8rem;
  color: var(--accent-amber);
  line-height: 1;
}

.stat-big .label {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-top: 6px;
}

/* ═══════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--modal-backdrop);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-normal);
}

.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 24px;
  width: 90%;
  max-width: 420px;
  box-shadow: var(--shadow-lg);
  transform: translateY(20px) scale(0.97);
  transition: transform var(--transition-slow), background var(--transition-normal);
}

.modal-overlay.open .modal { transform: translateY(0) scale(1); }

.modal h2 {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 400;
  margin-bottom: 18px;
}

.form-group { margin-bottom: 14px; }

.form-group label {
  display: block;
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 5px;
}

.form-input {
  width: 100%;
  padding: 9px 12px;
  background: var(--input-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  color: var(--text-primary);
  transition: border-color var(--transition-fast);
}

.form-input:focus { outline: none; border-color: var(--accent-amber); }

.form-select {
  width: 100%;
  padding: 9px 12px;
  background: var(--input-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  color: var(--text-primary);
  appearance: none;
  cursor: pointer;
}

.form-select:focus { outline: none; border-color: var(--accent-amber); }

.color-picker { display: flex; gap: 7px; flex-wrap: wrap; }

.color-option {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all var(--transition-fast);
}

.color-option:hover { transform: scale(1.15); }
.color-option.selected { border-color: var(--text-primary); transform: scale(1.15); }

.emoji-picker { display: flex; gap: 5px; flex-wrap: wrap; }

.emoji-option {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.05rem;
  cursor: pointer;
  transition: all var(--transition-fast);
  border: 2px solid transparent;
}

.emoji-option:hover { background: var(--bg-tertiary); }
.emoji-option.selected { border-color: var(--accent-amber); background: var(--bg-tertiary); }

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 20px;
}

.btn {
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  font-weight: 500;
  transition: all var(--transition-fast);
}

.btn-secondary {
  background: var(--bg-tertiary);
  color: var(--text-secondary);
}

.btn-secondary:hover { background: var(--bg-elevated); color: var(--text-primary); }

.btn-primary {
  background: var(--accent-amber);
  color: var(--bg-primary);
}

.btn-primary:hover { background: var(--accent-amber-dim); }

/* Day detail modal */
.day-detail-notes { max-height: 280px; overflow-y: auto; }

.day-detail-item {
  padding: 8px 0;
  border-bottom: 1px solid var(--border-subtle);
}

.day-detail-item:last-child { border-bottom: none; }

.day-detail-item .ddi-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
}

.day-detail-item .ddi-note {
  font-size: 0.75rem;
  color: var(--text-secondary);
  font-style: italic;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 50px 20px;
  max-width: 380px;
  margin: 0 auto;
}

.empty-state .empty-icon {
  font-size: 2.8rem;
  margin-bottom: 14px;
  opacity: 0.6;
}

.empty-state h3 {
  font-family: var(--font-display);
  font-size: 1.2rem;
  font-weight: 400;
  margin-bottom: 6px;
}

.empty-state p {
  color: var(--text-secondary);
  font-size: 0.85rem;
  line-height: 1.6;
}

/* Animations */
@keyframes popIn {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes confetti {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(-40px) rotate(180deg); opacity: 0; }
}

.confetti-burst {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  pointer-events: none;
  animation: confetti 0.6s ease-out forwards;
}

.view { animation: fadeIn 0.25s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ═══════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════ */
@media (max-width: 768px) {
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 150;
    transform: translateX(-100%);
    width: 260px !important;
  }

  .sidebar.open { transform: translateX(0); }
  .sidebar.collapsed { width: 260px !important; }

  .sidebar-backdrop {
    position: fixed;
    inset: 0;
    background: var(--sidebar-backdrop);
    z-index: 140;
    display: none;
  }

  .sidebar-backdrop.open { display: block; }

  .content { padding: 14px; }

  .week-grid {
    grid-template-columns: 70px repeat(7, 1fr);
  }

  .cal-day { min-height: 52px; padding: 4px; }
  .day-date { font-size: 1.4rem; }
  .topbar { padding: 8px 12px; }
  .view-tab { padding: 5px 8px; font-size: 0.7rem; }
  .stats-grid { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
  .topbar-brand h1 { display: none; }
  .view-tabs { gap: 0; }
  .view-tab { padding: 5px 6px; font-size: 0.68rem; }
  .topbar { gap: 8px; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--bg-hover); }

::selection { background: var(--accent-amber); color: var(--bg-primary); }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar-brand">
      <button class="btn-icon" id="sidebarToggle" title="Toggle sidebar">☰</button>
      <div class="logo">🔥</div>
      <h1>Ember</h1>
    </div>

    <nav class="view-tabs" id="viewTabs">
      <button class="view-tab active" data-view="day">Day</button>
      <button class="view-tab" data-view="week">Week</button>
      <button class="view-tab" data-view="month">Month</button>
      <button class="view-tab" data-view="year">Year</button>
      <button class="view-tab" data-view="stats">Stats</button>
    </nav>

    <div class="topbar-actions">
      <div class="theme-toggle" id="themeToggle" title="Toggle light/dark theme">
        <div class="theme-toggle-icons">
          <span>🌙</span>
          <span>☀️</span>
        </div>
      </div>

    </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="main">
    <aside class="sidebar collapsed" id="sidebar">
      <div class="sidebar-header">
        <h2>Habits</h2>
        <button class="btn-add-habit" id="addHabitBtn" title="Add habit">+</button>
      </div>
      <div class="habit-list" id="habitList"></div>
    </aside>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- Add/Edit Habit Modal -->
<div class="modal-overlay" id="habitModal">
  <div class="modal">
    <h2 id="habitModalTitle">New Habit</h2>
    <form id="habitForm">
      <input type="hidden" id="habitId">
      <div class="form-group">
        <label for="habitName">Name</label>
        <input type="text" class="form-input" id="habitName" placeholder="e.g. Morning meditation" maxlength="50" required>
      </div>
      <div class="form-group">
        <label for="habitCategory">Category</label>
        <select class="form-select" id="habitCategory">
          <option value="Health">🫀 Health</option>
          <option value="Work">💼 Work</option>
          <option value="Mind">🧠 Mind</option>
          <option value="Creative">🎨 Creative</option>
          <option value="Social">👥 Social</option>
          <option value="Other">✨ Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Icon</label>
        <div class="emoji-picker" id="emojiPicker"></div>
      </div>
      <div class="form-group">
        <label>Color</label>
        <div class="color-picker" id="colorPicker"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="cancelHabit">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveHabit">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Day Detail Modal -->
<div class="modal-overlay" id="dayDetailModal">
  <div class="modal">
    <h2 id="dayDetailTitle">Day Details</h2>
    <div class="day-detail-notes" id="dayDetailContent"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="closeDayDetail">Close</button>
    </div>
  </div>
</div>

<div class="heatmap-tooltip" id="heatmapTooltip"></div>

<script>
/* ═══════════════════════════════════════════
   DATA LAYER
   ═══════════════════════════════════════════ */
const STORAGE_KEY = 'ember_habits';
const RECORDS_KEY = 'ember_records';
const THEME_KEY = 'ember_theme';
const API_BASE_URL = (
  document.querySelector('meta[name="api-base-url"]')?.content?.trim() ||
  ((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? window.location.origin
    : '')
).replace(/\/$/, '');
const API_STATE_URL = `${API_BASE_URL}/api/state`;

const CATEGORIES = ['Health','Work','Mind','Creative','Social','Other'];
const CATEGORY_ICONS = { Health:'🫀', Work:'💼', Mind:'🧠', Creative:'🎨', Social:'👥', Other:'✨' };
const EMOJI_OPTIONS = ['🧘','💪','📖','✍️','🎯','💧','🏃','😴','🎵','🌿','💡','🔥','⭐','🧠','❤️','📝','🎨','🗣️','🌅','💻','🥗','🚶','🧹','📸'];
const COLOR_OPTIONS = ['#e07a5f','#e8a849','#5bb5a2','#d4687a','#9b8ec4','#8aab6e','#e8927c','#6ba3be','#c49bde','#a8c47a'];
const CATEGORY_COLORS = { Health:'#e07a5f', Work:'#e8a849', Mind:'#9b8ec4', Creative:'#d4687a', Social:'#5bb5a2', Other:'#8aab6e' };

const MOTIVATIONS = {
  perfect: ["Flawless day. You're on fire!", "Everything clicked today. Keep it up!", "Peak performance. The streak continues!"],
  great: ["Almost perfect — so close!", "Great day! You're building something real.", "Strong showing. Your future self thanks you."],
  good: ["Solid effort. Every day counts!", "Good progress. Consistency is the key.", "You showed up. That's what matters."],
  struggling: ["Tough day? Tomorrow's a fresh start.", "Rest if you must, but don't quit.", "Small steps still move you forward."],
  empty: ["Start small. Pick one habit today.", "The best time to start is now.", "Your journey begins with a single step."]
};

const SAMPLE_HABITS = [
  { id:'s1', name:'Morning Meditation', category:'Mind', color:'#9b8ec4', emoji:'🧘' },
  { id:'s2', name:'Exercise 30min', category:'Health', color:'#e07a5f', emoji:'💪' },
  { id:'s3', name:'Read 20 pages', category:'Mind', color:'#e8a849', emoji:'📖' },
  { id:'s4', name:'Drink 8 glasses', category:'Health', color:'#6ba3be', emoji:'💧' },
  { id:'s5', name:'Journal', category:'Creative', color:'#d4687a', emoji:'✍️' },
  { id:'s6', name:'No social media before noon', category:'Mind', color:'#8aab6e', emoji:'🎯' },
  { id:'s7', name:'Practice guitar', category:'Creative', color:'#c49bde', emoji:'🎵' },
  { id:'s8', name:'Walk outside', category:'Health', color:'#a8c47a', emoji:'🚶' },
];

function generateSampleRecords(habitIds) {
  const records = {};
  const today = new Date();
  for (let d = 30; d >= 1; d--) {
    const date = new Date(today);
    date.setDate(date.getDate() - d);
    const key = dk(date);
    records[key] = {};
    habitIds.forEach(id => {
      const r = Math.random();
      if (r < 0.65) {
        records[key][id] = { status:'done', effort: Math.ceil(Math.random()*3)+2, note: ['Felt great','Tired but pushed through','Easy win','Needed effort','Flow state'][Math.floor(Math.random()*5)] };
      } else if (r < 0.8) {
        records[key][id] = { status:'skipped', effort:0, note:'' };
      }
    });
  }
  return records;
}

function loadData() {
  try {
    const habits = JSON.parse(localStorage.getItem(STORAGE_KEY));
    const records = JSON.parse(localStorage.getItem(RECORDS_KEY));
    if (habits && habits.length > 0) return { habits, records: records || {} };
  } catch(e) {}
  const habits = SAMPLE_HABITS;
  const records = generateSampleRecords(SAMPLE_HABITS.map(h => h.id));
  saveData(habits, records);
  return { habits, records };
}

function saveData(habits, records) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
  localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
  syncStateToServer(habits, records);
}

async function syncStateToServer(habits, records) {
  if (!window.fetch) return;
  try {
    await fetch(API_STATE_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        habits,
        records,
        theme: localStorage.getItem(THEME_KEY) || document.documentElement.getAttribute('data-theme') || 'dark',
      }),
    });
  } catch (e) {}
}

async function syncThemeToServer(theme) {
  if (!window.fetch) return;
  try {
    await fetch(API_STATE_URL, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ theme }),
    });
  } catch (e) {}
}

async function hydrateStateFromServer() {
  if (!window.fetch) return;
  try {
    const response = await fetch(API_STATE_URL, { cache: 'no-store' });
    if (!response.ok) return;
    const remote = await response.json();
    const hasRemoteHabits = Array.isArray(remote.habits) && remote.habits.length > 0;
    const hasLocalHabits = Array.isArray(state.habits) && state.habits.length > 0;

    if (hasRemoteHabits) {
      state.habits = remote.habits;
      state.records = remote.records || {};
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.habits));
      localStorage.setItem(RECORDS_KEY, JSON.stringify(state.records));
      if (remote.theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem(THEME_KEY, 'light');
      }
      render();
      return;
    }

    if (hasLocalHabits) {
      await syncStateToServer(state.habits, state.records);
    }

    if (remote.theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem(THEME_KEY, 'light');
    }
  } catch (e) {}
}

function dk(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function pk(key) {
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d);
}

/* ═══════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════ */
let state = {
  habits: [],
  records: {},
  currentView: 'day',
  selectedDate: new Date(),
  selectedHabit: null,
  sidebarOpen: false,
};

/* ═══════════════════════════════════════════
   THEME
   ═══════════════════════════════════════════ */
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  if (next === 'dark') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
  }
  localStorage.setItem(THEME_KEY, next);
  syncThemeToServer(next);
}

initTheme();

/* ═══════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════ */
function uid() { return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function fmtDate(d) {
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

function fmtShort(d) {
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function isToday(d) {
  const t = new Date();
  return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
}

function weekStart(d) {
  const date = new Date(d);
  date.setDate(date.getDate() - date.getDay());
  date.setHours(0,0,0,0);
  return date;
}

function daysFrom(start, count) {
  const days = [];
  const d = new Date(start);
  for (let i = 0; i < count; i++) { days.push(new Date(d)); d.setDate(d.getDate()+1); }
  return days;
}

function getRec(date, hid) {
  const r = state.records[dk(date)];
  return (r && r[hid]) || null;
}

function setRec(date, hid, data) {
  const k = dk(date);
  if (!state.records[k]) state.records[k] = {};
  state.records[k][hid] = data;
  saveData(state.habits, state.records);
}

function getStreak(hid) {
  let streak = 0;
  const d = new Date();
  const todayRec = getRec(d, hid);
  if (!todayRec || todayRec.status !== 'done') d.setDate(d.getDate()-1);
  while (true) {
    const rec = getRec(d, hid);
    if (rec && rec.status === 'done') { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function getLongestStreak(hid) {
  let longest = 0, cur = 0;
  for (const key of Object.keys(state.records).sort()) {
    const rec = state.records[key][hid];
    if (rec && rec.status === 'done') { cur++; longest = Math.max(longest, cur); }
    else cur = 0;
  }
  return longest;
}

function completionRate(days) {
  if (state.habits.length === 0) return 0;
  let total = 0, done = 0;
  const today = new Date();
  for (let i = 0; i < days; i++) {
    const d = new Date(today); d.setDate(d.getDate()-i);
    const k = dk(d);
    state.habits.forEach(h => {
      total++;
      const rec = state.records[k] && state.records[k][h.id];
      if (rec && rec.status === 'done') done++;
    });
  }
  return total > 0 ? Math.round((done/total)*100) : 0;
}

function motivation() {
  const r7 = completionRate(7);
  if (state.habits.length === 0) return MOTIVATIONS.empty[0];
  if (r7 >= 90) return MOTIVATIONS.perfect[Math.floor(Math.random()*MOTIVATIONS.perfect.length)];
  if (r7 >= 70) return MOTIVATIONS.great[Math.floor(Math.random()*MOTIVATIONS.great.length)];
  if (r7 >= 40) return MOTIVATIONS.good[Math.floor(Math.random()*MOTIVATIONS.good.length)];
  return MOTIVATIONS.struggling[Math.floor(Math.random()*MOTIVATIONS.struggling.length)];
}

function completionsOn(date) {
  const dayRec = state.records[dk(date)] || {};
  let c = 0;
  state.habits.forEach(h => { if (dayRec[h.id] && dayRec[h.id].status === 'done') c++; });
  return c;
}

function totalCompletions() {
  let c = 0;
  Object.values(state.records).forEach(day => Object.values(day).forEach(r => { if (r.status==='done') c++; }));
  return c;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ═══════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════ */
const content = document.getElementById('content');

function render() {
  renderHabitList();
  const fn = { day:renderDay, week:renderWeek, month:renderMonth, year:renderYear, stats:renderStats };
  (fn[state.currentView] || renderDay)();
}

function renderHabitList() {
  const list = document.getElementById('habitList');
  if (state.habits.length === 0) {
    list.innerHTML = `<div class="empty-state" style="padding:24px 12px"><div class="empty-icon">🌱</div><h3>No habits yet</h3><p>Tap + to add your first habit.</p></div>`;
    return;
  }
  list.innerHTML = state.habits.map(h => {
    const streak = getStreak(h.id);
    const color = h.color || CATEGORY_COLORS[h.category] || '#888';
    const sel = state.selectedHabit === h.id ? ' selected' : '';
    return `<div class="habit-item${sel}" data-id="${h.id}"><div class="habit-dot" style="background:${color}"></div><div class="habit-info"><div class="habit-name">${h.emoji||''} ${esc(h.name)}</div><div class="habit-category">${h.category}</div></div>${streak>0?`<span class="habit-streak-badge">${streak}🔥</span>`:''}<button class="btn-delete" data-id="${h.id}" title="Delete">✕</button></div>`;
  }).join('');
}

/* ─── DAY VIEW ─── */
function renderDay() {
  const d = state.selectedDate;
  const done = state.habits.filter(h => { const r = getRec(d,h.id); return r && r.status==='done'; }).length;
  const total = state.habits.length;
  const pct = total > 0 ? Math.round((done/total)*100) : 0;

  content.innerHTML = `<div class="view"><div class="day-header"><div class="day-nav"><button class="day-nav-btn" id="prevDay">←</button><button class="day-nav-btn today-btn" id="todayBtn">Today</button><button class="day-nav-btn" id="nextDay">→</button></div><div class="day-date">${fmtDate(d)}</div><div class="day-progress"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-text">${done}/${total}</span></div></div><div class="motivation">${motivation()}</div>${state.habits.length===0?`<div class="empty-state"><div class="empty-icon">✨</div><h3>Begin your journey</h3><p>Add your first habit using the + button.</p></div>`:`<div class="checkin-list">${state.habits.map(h => checkinCard(h,d)).join('')}</div>`}</div>`;

  bindNav('prevDay','nextDay','todayBtn', () => { d.setDate(d.getDate()-1); }, () => { d.setDate(d.getDate()+1); });
  document.getElementById('todayBtn').onclick = () => { state.selectedDate = new Date(); render(); };
  attachCheckinListeners(d);
}

function checkinCard(h, date) {
  const rec = getRec(date, h.id);
  const status = rec ? rec.status : 'missed';
  const effort = rec ? rec.effort : 0;
  const note = rec ? rec.note : '';
  const color = h.color || CATEGORY_COLORS[h.category] || '#888';
  const sc = status==='done'?'status-done':status==='skipped'?'status-skipped':'';

  return `<div class="checkin-card ${sc}"><div class="checkin-top"><button class="toggle-done ${status==='done'?'done':''} ${status==='skipped'?'skipped':''}" data-habit="${h.id}">${status==='done'?'✓':status==='skipped'?'—':''}</button><div class="checkin-title"><span class="emoji">${h.emoji||''}</span><span class="name">${esc(h.name)}</span></div><div class="status-actions"><button class="status-btn ${status==='skipped'?'active-skip':''}" data-habit="${h.id}" data-status="skipped">Skip</button></div></div><div class="checkin-effort"><span class="effort-label">Effort</span><div class="stars">${[1,2,3,4,5].map(v=>`<span class="star ${v<=effort?'active':''}" data-habit="${h.id}" data-value="${v}">★</span>`).join('')}</div></div><div class="checkin-note"><textarea class="note-input" data-habit="${h.id}" placeholder="Add a note..." maxlength="200">${esc(note)}</textarea></div></div>`;
}

function attachCheckinListeners(date) {
  state.habits.forEach(h => {
    const toggle = content.querySelector(`.toggle-done[data-habit="${h.id}"]`);
    const skipBtn = content.querySelector(`.status-btn[data-habit="${h.id}"][data-status="skipped"]`);
    const noteInput = content.querySelector(`.note-input[data-habit="${h.id}"]`);

    if (toggle) {
      toggle.onclick = () => {
        const rec = getRec(date, h.id);
        const ns = (!rec || rec.status !== 'done') ? 'done' : 'missed';
        setRec(date, h.id, { status:ns, effort:rec?rec.effort:0, note:rec?rec.note:'' });
        if (ns === 'done') burstEffect(toggle);
        render();
      };
    }

    if (skipBtn) {
      skipBtn.onclick = () => {
        const rec = getRec(date, h.id);
        const isSkip = rec && rec.status === 'skipped';
        setRec(date, h.id, { status:isSkip?'missed':'skipped', effort:rec?rec.effort:0, note:rec?rec.note:'' });
        render();
      };
    }

    if (noteInput) {
      noteInput.oninput = (e) => {
        const rec = getRec(date, h.id) || { status:'missed', effort:0 };
        rec.note = e.target.value;
        setRec(date, h.id, rec);
      };
    }

    content.querySelectorAll(`.star[data-habit="${h.id}"]`).forEach(star => {
      star.onclick = () => {
        const val = parseInt(star.dataset.value);
        const rec = getRec(date, h.id) || { status:'missed', note:'' };
        rec.effort = rec.effort === val ? 0 : val;
        setRec(date, h.id, rec);
        render();
      };
    });
  });
}

function burstEffect(el) {
  const rect = el.getBoundingClientRect();
  const colors = ['#e8a849','#e07a5f','#5bb5a2','#d4687a','#9b8ec4','#8aab6e'];
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-burst';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.left = (rect.left+rect.width/2+(Math.random()-0.5)*30)+'px';
    p.style.top = (rect.top+rect.height/2)+'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 600);
  }
}

/* ─── WEEK VIEW ─── */
function renderWeek() {
  const ws = weekStart(state.selectedDate);
  const days = daysFrom(ws, 7);
  const dn = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const we = new Date(days[6]);

  let html = `<div class="view"><div class="week-header"><h2>${fmtShort(days[0])} — ${fmtShort(we)}, ${we.getFullYear()}</h2><div class="week-nav-group"><button class="day-nav-btn" id="prevWeek">←</button><button class="day-nav-btn today-btn" id="todayWeek">Today</button><button class="day-nav-btn" id="nextWeek">→</button></div></div><div class="week-grid"><div class="week-grid-header"></div>${days.map((d,i)=>`<div class="week-grid-header ${isToday(d)?'today':''}"><div class="day-name">${dn[i]}</div><div class="day-num">${d.getDate()}</div></div>`).join('')}${state.habits.map(h=>{const c=h.color||CATEGORY_COLORS[h.category]||'#888';return`<div class="week-grid-label"><span>${h.emoji||''}</span><span class="wl-name">${esc(h.name)}</span></div>${days.map(d=>{const r=getRec(d,h.id);const cls=r?r.status:'missed';return`<div class="week-grid-cell" data-date="${dk(d)}" data-habit="${h.id}"><div class="habit-dot-week ${cls}" style="--dot-color:${c}"></div></div>`;}).join('')}`;}).join('')}</div></div>`;

  content.innerHTML = html;

  bindNav('prevWeek','nextWeek','todayWeek',
    () => { state.selectedDate.setDate(state.selectedDate.getDate()-7); },
    () => { state.selectedDate.setDate(state.selectedDate.getDate()+7); }
  );
  document.getElementById('todayWeek').onclick = () => { state.selectedDate = new Date(); render(); };

  content.querySelectorAll('.week-grid-cell').forEach(cell => {
    cell.onclick = () => openDayDetail(pk(cell.dataset.date));
  });
}

/* ─── MONTH VIEW ─── */
function renderMonth() {
  const d = new Date(state.selectedDate);
  const year = d.getFullYear(), month = d.getMonth();
  const first = new Date(year, month, 1);
  const dn = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const start = new Date(first);
  start.setDate(start.getDate() - start.getDay());
  const days = daysFrom(start, 42);
  const mName = d.toLocaleDateString('en-US', { month:'long', year:'numeric' });

  content.innerHTML = `<div class="view"><div class="month-header"><h2>${mName}</h2><div class="month-nav-group"><button class="day-nav-btn" id="prevMonth">←</button><button class="day-nav-btn today-btn" id="todayMonth">Today</button><button class="day-nav-btn" id="nextMonth">→</button></div></div><div class="calendar-grid">${dn.map(n=>`<div class="cal-header">${n}</div>`).join('')}${days.map(day=>{const other=day.getMonth()!==month;const tdy=isToday(day);const recs=state.records[dk(day)]||{};const dots=state.habits.filter(h=>recs[h.id]&&recs[h.id].status==='done').map(h=>`<div class="cal-dot" style="background:${h.color||CATEGORY_COLORS[h.category]||'#888'}"></div>`).join('');return`<div class="cal-day ${other?'other-month':''} ${tdy?'today':''}" data-date="${dk(day)}"><div class="cal-day-num">${day.getDate()}</div><div class="cal-dots">${dots}</div></div>`;}).join('')}</div></div>`;

  bindNav('prevMonth','nextMonth','todayMonth',
    () => { state.selectedDate.setMonth(state.selectedDate.getMonth()-1); },
    () => { state.selectedDate.setMonth(state.selectedDate.getMonth()+1); }
  );
  document.getElementById('todayMonth').onclick = () => { state.selectedDate = new Date(); render(); };

  content.querySelectorAll('.cal-day').forEach(el => {
    el.onclick = () => openDayDetail(pk(el.dataset.date));
  });
}

/* ─── YEAR VIEW ─── */
function renderYear() {
  const year = state.selectedDate.getFullYear();
  const start = new Date(year, 0, 1);
  const end = new Date(year, 11, 31);
  const gs = new Date(start);
  gs.setDate(gs.getDate() - gs.getDay());
  const totalDays = Math.ceil((end-gs)/(1000*60*60*24)) + 1;
  const days = daysFrom(gs, totalDays);

  const months = [];
  let lastM = -1;
  days.forEach((d,i) => {
    if (d.getMonth()!==lastM && d.getFullYear()===year) { months.push({month:d.getMonth(),col:Math.floor(i/7)}); lastM=d.getMonth(); }
  });

  let maxC = 1;
  days.forEach(d => { if (d.getFullYear()===year) { const c=completionsOn(d); if(c>maxC)maxC=c; } });

  content.innerHTML = `<div class="view"><div class="year-header"><h2>${year}</h2><div class="year-nav-group"><button class="day-nav-btn" id="prevYear">←</button><button class="day-nav-btn today-btn" id="todayYear">Today</button><button class="day-nav-btn" id="nextYear">→</button></div></div><div class="heatmap-container"><div class="heatmap-months">${months.map(m=>`<span style="margin-left:${m.col*16}px">${new Date(year,m.month).toLocaleDateString('en-US',{month:'short'})}</span>`).join('')}</div><div class="heatmap" id="heatmap">${days.map(d=>{if(d.getFullYear()!==year)return`<div class="heat-cell" style="visibility:hidden"></div>`;const c=completionsOn(d);const lv=maxC>0?Math.ceil((c/maxC)*5):0;return`<div class="heat-cell" data-level="${lv}" data-date="${dk(d)}"></div>`;}).join('')}</div><div class="heatmap-legend"><span>Less</span><div class="heat-cell" data-level="0"></div><div class="heat-cell" data-level="1"></div><div class="heat-cell" data-level="2"></div><div class="heat-cell" data-level="3"></div><div class="heat-cell" data-level="4"></div><div class="heat-cell" data-level="5"></div><span>More</span></div></div></div>`;

  bindNav('prevYear','nextYear','todayYear',
    () => { state.selectedDate.setFullYear(state.selectedDate.getFullYear()-1); },
    () => { state.selectedDate.setFullYear(state.selectedDate.getFullYear()+1); }
  );
  document.getElementById('todayYear').onclick = () => { state.selectedDate = new Date(); render(); };

  const tooltip = document.getElementById('heatmapTooltip');
  content.querySelectorAll('.heat-cell[data-date]').forEach(cell => {
    cell.onmouseenter = (e) => {
      const d = pk(cell.dataset.date);
      const count = completionsOn(d);
      const dayRec = state.records[dk(d)] || {};
      const notes = state.habits.filter(h => dayRec[h.id] && dayRec[h.id].note && dayRec[h.id].note.trim()).map(h => `${h.emoji} ${dayRec[h.id].note}`);
      tooltip.innerHTML = `<div class="tt-date">${fmtDate(d)}</div><div class="tt-count">${count}/${state.habits.length} completed</div>${notes.length?`<div class="tt-notes">${notes.join('<br>')}</div>`:''}`;
      tooltip.style.display = 'block';
      const rect = cell.getBoundingClientRect();
      let left = rect.left + rect.width/2 - 100;
      let top = rect.bottom + 8;
      if (left < 8) left = 8;
      if (left + 220 > window.innerWidth) left = window.innerWidth - 228;
      if (top + 100 > window.innerHeight) top = rect.top - 100;
      tooltip.style.left = left + 'px';
      tooltip.style.top = top + 'px';
    };
    cell.onmouseleave = () => { tooltip.style.display = 'none'; };
    cell.onclick = () => openDayDetail(pk(cell.dataset.date));
  });
}

/* ─── STATS VIEW ─── */
function renderStats() {
  const r7 = completionRate(7), r30 = completionRate(30), tDays = Object.keys(state.records).length;
  const hStats = state.habits.map(h => ({...h, cs:getStreak(h.id), ls:getLongestStreak(h.id)})).sort((a,b) => b.cs - a.cs);

  content.innerHTML = `<div class="view"><div class="stats-grid"><div class="stat-card stat-big"><div class="number">${r7}%</div><div class="label">Last 7 days</div></div><div class="stat-card stat-big"><div class="number">${r30}%</div><div class="label">Last 30 days</div></div><div class="stat-card stat-big"><div class="number">${tDays}</div><div class="label">Days tracked</div></div><div class="stat-card"><h3>Habit Streaks</h3>${state.habits.length===0?'<p style="color:var(--text-muted);font-size:0.82rem">No habits yet</p>':hStats.map(h=>`<div class="stat-row"><span class="stat-label">${h.emoji||''} ${esc(h.name)}</span><span class="stat-value">${h.cs}🔥 / ${h.ls} best</span></div>`).join('')}</div><div class="stat-card"><h3>Categories (30d)</h3>${catStats()}</div><div class="stat-card"><h3>Overall</h3><div class="stat-row"><span class="stat-label">Active habits</span><span class="stat-value">${state.habits.length}</span></div><div class="stat-row"><span class="stat-label">Total completions</span><span class="stat-value">${totalCompletions()}</span></div><div class="stat-row"><span class="stat-label">Best habit</span><span class="stat-value">${hStats.length>0?(hStats[0].emoji||'')+' '+esc(hStats[0].name):'—'}</span></div></div></div></div>`;
}

function catStats() {
  const cats = {};
  CATEGORIES.forEach(c => { cats[c] = {total:0,done:0}; });
  const today = new Date();
  for (let i = 0; i < 30; i++) {
    const d = new Date(today); d.setDate(d.getDate()-i);
    const k = dk(d);
    state.habits.forEach(h => {
      if (cats[h.category]) { cats[h.category].total++; const r=state.records[k]&&state.records[k][h.id]; if(r&&r.status==='done')cats[h.category].done++; }
    });
  }
  return CATEGORIES.filter(c=>cats[c].total>0).map(c=>{const p=cats[c].total>0?Math.round((cats[c].done/cats[c].total)*100):0;return`<div class="stat-row"><span class="stat-label">${CATEGORY_ICONS[c]} ${c}</span><span class="stat-value">${p}%</span></div>`;}).join('') || '<p style="color:var(--text-muted);font-size:0.82rem">No data yet</p>';
}

/* ─── DAY DETAIL MODAL ─── */
function openDayDetail(date) {
  const modal = document.getElementById('dayDetailModal');
  document.getElementById('dayDetailTitle').textContent = fmtDate(date);
  const dayRec = state.records[dk(date)] || {};
  const items = state.habits.filter(h => dayRec[h.id]).map(h => {
    const rec = dayRec[h.id];
    const si = rec.status==='done'?'✓':rec.status==='skipped'?'—':'○';
    const sc = rec.status==='done'?'var(--accent-sage)':'var(--text-muted)';
    return `<div class="day-detail-item"><div class="ddi-header"><span>${h.emoji||''}</span><strong style="font-size:0.82rem">${esc(h.name)}</strong><span style="color:${sc};margin-left:auto">${si}</span>${rec.effort>0?`<span style="color:var(--accent-amber);font-size:0.72rem">${'★'.repeat(rec.effort)}</span>`:''}</div>${rec.note?`<div class="ddi-note">"${esc(rec.note)}"</div>`:''}</div>`;
  });
  document.getElementById('dayDetailContent').innerHTML = items.length > 0 ? items.join('') : '<p style="color:var(--text-muted);font-size:0.82rem;text-align:center;padding:18px 0">No activity for this day.</p>';
  modal.classList.add('open');
}

/* ═══════════════════════════════════════════
   NAVIGATION HELPER
   Binds prev/next/today buttons after render
   ═══════════════════════════════════════════ */
function bindNav(prevId, nextId, todayId, prevFn, nextFn) {
  const pb = document.getElementById(prevId);
  const nb = document.getElementById(nextId);
  if (pb) pb.onclick = () => { prevFn(); render(); };
  if (nb) nb.onclick = () => { nextFn(); render(); };
}

/* ═══════════════════════════════════════════
   MODALS
   ═══════════════════════════════════════════ */
const habitModal = document.getElementById('habitModal');
const habitForm = document.getElementById('habitForm');
let selEmoji = '🎯', selColor = COLOR_OPTIONS[0];

function initHabitModalPickers() {
  document.getElementById('emojiPicker').innerHTML = EMOJI_OPTIONS.map(e=>`<button type="button" class="emoji-option ${e===selEmoji?'selected':''}" data-emoji="${e}">${e}</button>`).join('');
  document.getElementById('colorPicker').innerHTML = COLOR_OPTIONS.map(c=>`<button type="button" class="color-option ${c===selColor?'selected':''}" data-color="${c}" style="background:${c}"></button>`).join('');
}

document.getElementById('emojiPicker').onclick = (e) => {
  const b = e.target.closest('.emoji-option'); if(!b) return;
  document.querySelectorAll('.emoji-option').forEach(el=>el.classList.remove('selected'));
  b.classList.add('selected'); selEmoji = b.dataset.emoji;
};

document.getElementById('colorPicker').onclick = (e) => {
  const b = e.target.closest('.color-option'); if(!b) return;
  document.querySelectorAll('.color-option').forEach(el=>el.classList.remove('selected'));
  b.classList.add('selected'); selColor = b.dataset.color;
};

function openAddHabit() {
  document.getElementById('habitModalTitle').textContent = 'New Habit';
  document.getElementById('habitId').value = '';
  document.getElementById('habitName').value = '';
  document.getElementById('habitCategory').value = 'Health';
  selEmoji = '🎯'; selColor = COLOR_OPTIONS[0];
  initHabitModalPickers();
  habitModal.classList.add('open');
  setTimeout(() => document.getElementById('habitName').focus(), 200);
}

function openEditHabit(id) {
  const h = state.habits.find(x=>x.id===id); if(!h) return;
  document.getElementById('habitModalTitle').textContent = 'Edit Habit';
  document.getElementById('habitId').value = h.id;
  document.getElementById('habitName').value = h.name;
  document.getElementById('habitCategory').value = h.category;
  selEmoji = h.emoji||'🎯'; selColor = h.color||CATEGORY_COLORS[h.category]||COLOR_OPTIONS[0];
  initHabitModalPickers();
  habitModal.classList.add('open');
}

function closeHabitModal() { habitModal.classList.remove('open'); }

habitForm.onsubmit = (e) => {
  e.preventDefault();
  const id = document.getElementById('habitId').value;
  const name = document.getElementById('habitName').value.trim();
  const category = document.getElementById('habitCategory').value;
  if (!name) return;
  if (id) {
    const h = state.habits.find(x=>x.id===id);
    if (h) { h.name=name; h.category=category; h.emoji=selEmoji; h.color=selColor; }
  } else {
    state.habits.push({ id:uid(), name, category, emoji:selEmoji, color:selColor });
  }
  saveData(state.habits, state.records);
  closeHabitModal();
  render();
};

document.getElementById('cancelHabit').onclick = closeHabitModal;
document.getElementById('closeDayDetail').onclick = () => document.getElementById('dayDetailModal').classList.remove('open');

[habitModal, document.getElementById('dayDetailModal')].forEach(m => {
  m.onclick = (e) => { if (e.target === m) m.classList.remove('open'); };
});

/* ═══════════════════════════════════════════
   EVENT LISTENERS — event delegation
   These survive re-renders because they attach
   to persistent parent elements
   ═══════════════════════════════════════════ */

// View tabs
document.getElementById('viewTabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.view-tab');
  if (!tab) return;
  state.currentView = tab.dataset.view;
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  render();
});

// Sidebar toggle
document.getElementById('sidebarToggle').addEventListener('click', () => {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebarBackdrop');
  if (window.innerWidth <= 768) {
    sb.classList.toggle('open');
    bd.classList.toggle('open');
  } else {
    sb.classList.toggle('collapsed');
  }
});

document.getElementById('sidebarBackdrop').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
});

// Habit list delegation
document.getElementById('habitList').addEventListener('click', (e) => {
  const del = e.target.closest('.btn-delete');
  if (del) {
    e.stopPropagation();
    const id = del.dataset.id;
    state.habits = state.habits.filter(h=>h.id!==id);
    Object.keys(state.records).forEach(k => { delete state.records[k][id]; });
    saveData(state.habits, state.records);
    if (state.selectedHabit === id) state.selectedHabit = null;
    render();
    return;
  }
  const item = e.target.closest('.habit-item');
  if (item) {
    const id = item.dataset.id;
    if (state.selectedHabit === id) openEditHabit(id);
    else { state.selectedHabit = id; render(); }
  }
});

// Add habit
document.getElementById('addHabitBtn').addEventListener('click', openAddHabit);

// Theme toggle
document.getElementById('themeToggle').addEventListener('click', toggleTheme);

// Settings (reset)
document.getElementById('settingsBtn').addEventListener('click', async () => {
  if (!confirm('Reset all data? This cannot be undone.')) return;

  // Clear local storage immediately
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(RECORDS_KEY);
  localStorage.removeItem(THEME_KEY);

  // Clear in-memory state
  state.habits = [];
  state.records = {};
  state.selectedDate = new Date();
  state.selectedHabit = null;
  document.documentElement.removeAttribute('data-theme');
  render();

  // Attempt to clear server-side state and inform the user
  try {
    const resp = await fetch(API_STATE_URL, { method: 'DELETE' });
    if (!resp.ok) {
      const body = await resp.text().catch(() => '');
      alert('Reset completed locally, but server reset failed: ' + resp.status + ' ' + body);
      return;
    }
    alert('All data has been reset locally and on the server.');
  } catch (err) {
    alert('Reset completed locally, but failed to contact server to clear remote data.');
  }
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    habitModal.classList.remove('open');
    document.getElementById('dayDetailModal').classList.remove('open');
  }
});

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
const data = loadData();
state.habits = data.habits;
state.records = data.records;
initHabitModalPickers();
render();
hydrateStateFromServer();
</script>
</body>
</html>
